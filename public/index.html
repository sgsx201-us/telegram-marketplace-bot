<script>
  const tg = window.Telegram?.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();
  }

  let products = [];
  let cart = [];
  let category = 'freefire';
  let currentPayment = null;
  let checking = false;

  const money = value => '₹' + Number(value || 0).toFixed(2);

  function safeCategory(product) {
    const categories = Array.isArray(product.categories)
      ? product.categories.join(' ')
      : (product.category || product.category_id || '');

    const value = String(categories).toLowerCase();

    if (/upi|payment/.test(value)) return 'upi';

    const text = String(product.name || '') + ' ' +
      String(product.id || '');

    if (/upi|payment/i.test(text)) return 'upi';

    return 'freefire';
  }

  function showCategory(value) {
    category = value;

    document.getElementById('freefireTab').classList.toggle(
      'active', value === 'freefire'
    );

    document.getElementById('upiTab').classList.toggle(
      'active', value === 'upi'
    );

    document.getElementById('allTab').classList.toggle(
      'active', value === 'all'
    );

    renderProducts();
  }

  async function loadProducts() {
    const container = document.getElementById('products');

    try {
      const response = await fetch('/api/products');

      if (!response.ok) {
        throw new Error('Could not load products.');
      }

      products = await response.json();

      if (!Array.isArray(products)) {
        throw new Error('Invalid product list.');
      }

      renderProducts();
    } catch (error) {
      container.innerHTML =
        '<div class="empty">Could not load products. Please try again later.</div>';
    }
  }

  function getPlans(product) {
    return Array.isArray(product.plans) ? product.plans : [];
  }

  function isPlanAvailable(plan) {
    if (plan.available === false) return false;
    if (plan.stock === null || plan.stock === undefined) return true;
    return Number(plan.stock) > 0;
  }

  function planStock(plan) {
    if (!isPlanAvailable(plan)) return 0;
    if (plan.stock === null || plan.stock === undefined) return null;
    return Number(plan.stock || 0);
  }

  function renderProducts() {
    const container = document.getElementById('products');
    container.innerHTML = '';

    const available = products.filter(product =>
      product.active === true &&
      (category === 'all' || safeCategory(product) === category)
    );

    if (!available.length) {
      container.innerHTML =
        '<div class="empty">No active products in this category yet.</div>';
      return;
    }

    available.forEach(product => {
      const card = document.createElement('article');
      card.className = 'product';

      const name = document.createElement('h3');
      name.textContent = product.name;

      const description = document.createElement('p');
      description.textContent =
        product.description || 'Digital product';

      card.append(name, description);

      const plans = getPlans(product);

      if (!plans.length) {
        const notice = document.createElement('p');
        notice.className = 'message';
        notice.textContent = 'Plans are currently unavailable.';
        card.appendChild(notice);
        container.appendChild(card);
        return;
      }

      const select = document.createElement('select');
      select.className = 'plan-select';

      plans.forEach((plan, index) => {
        const option = document.createElement('option');
        option.value = String(index);

        const stock = planStock(plan);
        const stockText = !isPlanAvailable(plan)
          ? ' • OUT OF STOCK'
          : stock !== null
            ? ' • IN STOCK: ' + stock
            : ' • AVAILABLE';

        option.textContent =
          plan.duration + ' — ' + money(plan.price_inr) + stockText;

        select.appendChild(option);
      });

      const price = document.createElement('div');
      price.className = 'price';

      const stockLabel = document.createElement('div');
      stockLabel.className = 'stock';

      const add = document.createElement('button');
      add.className = 'add';

      function updateSelectedPlan() {
        const plan = plans[Number(select.value)];
        const availablePlan = isPlanAvailable(plan);
        const stock = planStock(plan);

        price.textContent = money(plan.price_inr);

        if (!availablePlan) {
          stockLabel.textContent = '❌ OUT OF STOCK';
          stockLabel.className = 'stock out-stock';
        } else if (stock !== null) {
          stockLabel.textContent = '✅ IN STOCK: ' + stock;
          stockLabel.className = 'stock in-stock';
        } else {
          stockLabel.textContent = '✅ INSTANT DELIVERY';
          stockLabel.className = 'stock in-stock';
        }

        const alreadyAdded = cart.some(item =>
          item.productId === product.id &&
          String(item.durationId) === String(plan.duration_id)
        );

        add.textContent = alreadyAdded ? 'Added to Cart' : 'Add to Cart';
        add.disabled = !availablePlan || alreadyAdded;
      }

      select.addEventListener('change', updateSelectedPlan);

      add.onclick = () => {
        const plan = plans[Number(select.value)];

        if (!plan || !isPlanAvailable(plan)) return;

        addToCart(product, plan);
        updateSelectedPlan();
      };

      card.append(select, price, stockLabel, add);
      container.appendChild(card);

      updateSelectedPlan();
    });
  }

  function addToCart(product, plan) {
    const exists = cart.some(item =>
      item.productId === product.id &&
      String(item.durationId) === String(plan.duration_id)
    );

    if (exists || !isPlanAvailable(plan)) return;

    cart.push({
      productId: product.id,
      durationId: plan.duration_id,
      name: product.name,
      duration: plan.duration,
      price: Number(plan.price_inr)
    });

    renderCart();
    renderProducts();
  }

  function removeFromCart(productId, durationId) {
    cart = cart.filter(item =>
      !(item.productId === productId &&
        String(item.durationId) === String(durationId))
    );

    renderCart();
    renderProducts();
  }

  function renderCart() {
    const container = document.getElementById('cart');
    container.innerHTML = '';

    if (!cart.length) {
      container.innerHTML =
        '<p class="message">Your cart is empty.</p>';
    } else {
      cart.forEach(item => {
        const row = document.createElement('div');
        row.className = 'cart-item';

        const label = document.createElement('span');
        label.textContent =
          item.name + ' (' + item.duration + ') — ' +
          money(item.price);

        const remove = document.createElement('button');
        remove.textContent = 'Remove';
        remove.style.background = '#414253';
        remove.style.color = 'white';
        remove.style.padding = '7px';

        remove.onclick = () =>
          removeFromCart(item.productId, item.durationId);

        row.append(label, remove);
        container.appendChild(row);
      });
    }

    const total = cart.reduce(
      (sum, item) => sum + item.price, 0
    );

    document.getElementById('total').textContent = money(total);
    document.getElementById('checkout').disabled = !cart.length;
  }

  async function checkout() {
    const message = document.getElementById('shopMessage');
    const button = document.getElementById('checkout');

    if (!tg?.initData) {
      message.textContent =
        'Please open this shop from your Telegram bot using /start.';
      return;
    }

    if (!cart.length) return;

    button.disabled = true;
    message.textContent = 'Creating your payment...';

    try {
      const response = await fetch('/api/create-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          initData: tg.initData,

          items: cart.map(item => ({
            productId: item.productId,
            durationId: item.durationId,
            quantity: 1
          }))
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Could not create payment.');
      }

      if (data.status === 'PAID') {
        cart = [];
        renderCart();
        renderProducts();
        document.getElementById('payment').style.display = 'none';
        message.textContent =
          data.message || 'Paid using wallet! Check your Telegram chat for your key.';
        return;
      }

      currentPayment = {
        agOrderId: data.agOrderId,
        payUrl: data.payUrl,
        upiLink: data.upiLink
      };

      const walletUsedNum = Number(data.walletUsed || 0);
      document.getElementById('paymentAmount').textContent =
        walletUsedNum > 0
          ? `UPI Remaining: ${money(data.amount)} (Wallet used: ${money(walletUsedNum)} of ${money(data.totalAmount)})`
          : 'Amount: ' + money(data.amount);

      const qr = document.getElementById('qr');

      if (data.qrPngUrl) {
        qr.src = data.qrPngUrl;
        qr.hidden = false;
      } else {
        qr.hidden = true;
      }

      const payLink = document.getElementById('payLink');

      if (data.payUrl) {
        payLink.href = data.payUrl;
        payLink.hidden = false;

        payLink.onclick = event => {
          event.preventDefault();

          if (tg) tg.openLink(data.payUrl);
          else window.open(data.payUrl, '_blank');
        };
      } else {
        payLink.hidden = true;
      }

      const upiLink = document.getElementById('upiLink');

      if (data.upiLink) {
        upiLink.href = data.upiLink;
        upiLink.hidden = false;
      } else {
        upiLink.hidden = true;
      }

      document.getElementById('paymentMessage').textContent =
        'Payment order created. Complete payment and verify below.';

      document.getElementById('payment').style.display = 'block';

      document.getElementById('payment').scrollIntoView({
        behavior: 'smooth'
      });

      message.textContent = '';
    } catch (error) {
      message.textContent = error.message;
    } finally {
      button.disabled = !cart.length;
    }
  }

  async function checkPayment() {
    if (!currentPayment || checking) return;

    if (!tg?.initData) {
      document.getElementById('paymentMessage').textContent =
        'Please open the shop through Telegram.';
      return;
    }

    checking = true;

    const button = document.getElementById('checkPayment');
    const message = document.getElementById('paymentMessage');

    button.disabled = true;
    message.textContent = 'Checking payment with gateway...';

    try {
      const response = await fetch('/api/check-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          initData: tg.initData,
          agOrderId: currentPayment.agOrderId
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Payment check failed.');
      }

      if (data.status === 'PAID') {
        message.textContent =
          'Payment confirmed! Check your Telegram chat for delivery.';

        cart = [];
        renderCart();
        renderProducts();
        currentPayment = null;
      } else if (data.status === 'EXPIRED') {
        message.textContent =
          'Payment expired. Please create a new order.';
      } else {
        message.textContent =
          'Payment is still pending. Complete payment and try again.';
      }
    } catch (error) {
      message.textContent = error.message;
    } finally {
      checking = false;
      button.disabled = !currentPayment;
    }
  }

  loadProducts();
  renderCart();
</script>
